[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-auditor"
version = "0.0.0"
description = "Auditoria determinística de XMLs de NF-e"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "ruff==0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "aceitacao: critérios de aceite da fase em execução",
]

[tool.ruff]
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
